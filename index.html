<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Captain of Industry Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23c8781a%27/%3E%3Cpath d=%27M3 12V6l3 2V6l3 2V4h2v8z%27 fill=%27%23fff%27/%3E%3C/svg%3E"></head>
<body><div id="app"></div><script type="module" src="/src/main.ts"></script>
<noscript><p style="font:16px system-ui;margin:16px">This planner needs JavaScript.</p></noscript>
<script>
  // If the app didn't start, say why instead of leaving a blank page. The usual cause on GitHub Pages is serving the
  // repository's source files instead of the built site (Settings > Pages > Source must be "GitHub Actions").
  setTimeout(function () {
    var app = document.getElementById("app");
    if (app && !app.children.length) {
      app.innerHTML = '<div style="font:16px/1.5 system-ui;max-width:560px;margin:24px auto;padding:16px;border:1px solid #b5651d;border-radius:6px">' +
        '<b>The planner did not start.</b><br>If you are on GitHub Pages, this is the unbuilt source page. ' +
        'In the repository go to <b>Settings &rarr; Pages</b> and set <b>Source</b> to <b>GitHub Actions</b>, then re-run the latest workflow.</div>';
    }
  }, 2500);
</script></body></html>
